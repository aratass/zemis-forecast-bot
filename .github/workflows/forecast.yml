name: forecast

# One pass per run on a plain schedule, the way Metaculus's own bot template
# runs. Until 2 Oct 2026 this workflow chained five and a half hour watcher
# jobs so a runner was busy around the clock. That is not what GitHub-hosted
# runners are for (their terms cover building, testing and deploying a
# project), and the same account hosts other projects, so the chain is gone.
# GitHub's scheduler has been unreliable for this repository, so some
# questions may be missed. That is accepted: the bot is a lottery ticket, not
# an income line.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: which tournaments to poll
        type: choice
        default: tournament
        options: [tournament, seasonal, minibench, test]
      dry_run:
        description: run without submitting
        type: boolean
        default: false
      watch:
        description: ignored since 2 Oct 2026, every run is one pass (kept so an older watcher can still hand over without an error)
        type: boolean
        default: false

# One watcher at a time on main. A run on any other branch (a dry run of a
# change, say) gets its own group: in the shared group it would sit pending
# behind a five hour watcher and then be cancelled by the watcher's own
# handover, which also queues in that group.
concurrency:
  group: ${{ github.ref_name == 'main' && 'forecast-watcher' || format('forecast-trial-{0}', github.ref_name) }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: self-audit
        # The bot's record and the models this watcher will use, as
        # annotations. Its own step so that a failure here can never stop the
        # watcher. GitHub attaches annotations when the whole job ends; for a
        # reading within minutes, run the check-sources workflow instead.
        continue-on-error: true
        timeout-minutes: 5
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          BOT_STAND_INS: ${{ vars.BOT_STAND_INS }}
        run: python -m bot.runner --audit-only --mode "${{ inputs.mode || 'tournament' }}"
      - name: forecast
        env:
          # The step above has written the self-audit already.
          BOT_AUDIT: "off"
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # Repository variable, so reasoning effort can be turned down
          # without a deploy if it starts costing coverage. Empty means high.
          BOT_REASONING: ${{ vars.BOT_REASONING }}
          # Repository variable. Empty or "off": only the Flash models
          # forecast. "on": weaker free models may answer near the deadline.
          BOT_STAND_INS: ${{ vars.BOT_STAND_INS }}
        run: |
          python -m bot.runner \
            --mode "${{ inputs.mode || 'tournament' }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

name: forecast

# GitHub's cron does not work for this repository. Over the first two days it
# fired twice against a schedule asking every fifteen minutes, and after the
# workflow was disabled and re-enabled it stopped firing for over an hour.
# Questions are open to bots for about three hours, and a question never
# forecast scores the same as one forecast badly, so coverage cannot depend on
# it.
#
# So a watcher no longer does one pass and exit. It polls inside a single job
# for five and a half hours, and on the way out it starts its replacement. The
# cron below stays only as a safety net for when the chain breaks. The
# concurrency group means one watcher at a time: a firing that arrives while
# one is running waits its turn rather than doubling up. Manual runs without
# the watch box ticked still do a single pass.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: which tournaments to poll
        type: choice
        default: tournament
        options: [tournament, seasonal, minibench, test]
      dry_run:
        description: run without submitting
        type: boolean
        default: false
      watch:
        description: keep polling for five and a half hours instead of one pass
        type: boolean
        default: false

# One watcher at a time on main. A run on any other branch (a dry run of a
# change, say) gets its own group: in the shared group it would sit pending
# behind a five hour watcher and then be cancelled by the watcher's own
# handover, which also queues in that group.
concurrency:
  group: ${{ github.ref_name == 'main' && 'forecast-watcher' || format('forecast-trial-{0}', github.ref_name) }}
  cancel-in-progress: false

# models: read lets the job's own GITHUB_TOKEN call GitHub Models, the free
# GPT-4.1 stand-in. Nothing else is granted.
permissions:
  contents: read
  models: read

jobs:
  forecast:
    runs-on: ubuntu-latest
    # A job is killed at six hours. The watch window is deliberately shorter,
    # so the process exits on its own terms: a job killed by the timeout counts
    # as cancelled, and the handover step below does not run on cancellation.
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: note when this watcher started
        run: echo "WATCH_STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - name: check the handover token before spending five hours
        # The handover runs at the far end of the window. A broken or missing
        # WATCHER_PAT would therefore announce itself five and a half hours
        # after the mistake, by which point coverage has already stopped. One
        # API call at the start turns that into a warning in the first minute.
        if: ${{ github.event_name == 'schedule' || inputs.watch }}
        env:
          GH_TOKEN: ${{ secrets.WATCHER_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::WATCHER_PAT is empty. This watcher will run, but nothing will start the next one."
            exit 0
          fi
          if gh run list --workflow forecast.yml --limit 1 >/dev/null 2>&1; then
            echo "handover token works; this watcher can start its replacement"
          else
            echo "::warning::WATCHER_PAT is set but cannot read this repository's runs. It probably needs Actions: read and write."
          fi
      - name: forecast
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Repository variable, so reasoning effort can be turned down
          # without a deploy if it starts costing coverage. Empty means high.
          BOT_REASONING: ${{ vars.BOT_REASONING }}
        run: |
          python -m bot.runner \
            --mode "${{ inputs.mode || 'tournament' }}" \
            ${{ (github.event_name == 'schedule' || inputs.watch) && '--watch 19800 --interval 240' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: hand over to the next watcher
        # Only a watcher hands over, never a one-off manual pass.
        #
        # success() || failure() rather than always(): a cancelled run was
        # stopped by a person, and restarting it would be arguing with them.
        if: ${{ (success() || failure()) && (github.event_name == 'schedule' || inputs.watch) }}
        env:
          GH_TOKEN: ${{ secrets.WATCHER_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::warning::WATCHER_PAT is not set, so this watcher cannot start the next one. Coverage stops here."
            exit 0
          fi
          elapsed=$(( $(date +%s) - ${WATCH_STARTED:-0} ))
          echo "this watcher ran for ${elapsed}s"
          # A watcher that dies in minutes is broken, and chaining it would
          # spend the whole Actions allowance rediscovering that every few
          # minutes. Stop, and let the hourly cron or a person restart it.
          if [ "${elapsed}" -lt 1200 ]; then
            echo "::warning::only ${elapsed}s before exiting, so not chaining. Fix the failure and start one by hand."
            exit 0
          fi
          since=$(date -u -d '2 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list --workflow forecast.yml --limit 40 \
            --json createdAt --jq "[.[] | select(.createdAt > \"${since}\")] | length")
          if [ "${recent:-0}" -gt 4 ]; then
            echo "::warning::${recent} runs since ${since}, so not chaining."
            exit 0
          fi
          gh workflow run forecast.yml --ref "${GITHUB_REF_NAME}" -f mode=tournament -f watch=true
          echo "next watcher requested"
